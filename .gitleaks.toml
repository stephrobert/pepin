# gitleaks config for pepin. Extends the default rules and acquits, TARGETED, the only
# non-secrets that trip them: deliberately fake placeholder keys in a demo/fixtures, and the
# scraped provider-doc cache. No real credential is ever committed (options CLI / env only).
title = "pepin gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Fake placeholder keys (IMDS/SSRF demo + rule-test fixtures) and the scraped doc cache."
# Placeholder keys used to demonstrate detection — obviously fake, never live. Acquitting them
# BY VALUE rather than by path keeps every file scanned: a directory-wide exclusion would also
# hide a real credential pasted there later, and the rule tests are exactly where one would land.
regexes = [
  '''AKIA0123456789ABCDEF''',
  '''AKIAABCDEFGHIJKLMNOP''',
  # compute_blockstorage_test.rego: fixtures asserting the secret detector fires.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3In0\.abcdefghij''',
  '''0123456789abcdef0123''',
  # Filler value that scripts/tenant-plan.py injects into third-party stacks so a
  # `terraform plan` resolves (see placeholder(), the "password" branch). It is OUR
  # constant, it opens nothing, and it appears in no upstream repository. It reads
  # as "Placeholder-Password" in leet, which is exactly why a pattern-based scanner
  # takes it for a secret: such a check answers "does this look like a secret",
  # never "is this one". The reducer now strips it from every plan, so it survives
  # only in the branch history that produced this note.
  '''Pl4ceholder-Passw0rd''',
]
paths = [
  # Regenerable cache of third-party provider docs (full of example keys) — gitignored too.
  '''references/docs/.*''',
  # IMDS/SSRF demonstration: the whole point is a token leaked via the metadata service.
  # Scoped to the Terraform source; plan.json stays scanned.
  '''examples/exoscale/lab-imds/main\.tf''',
]
