# Descripteur du provider Outscale — chargé par le provider générique.
# OAPI : signature V4 (en-tête AWS4-HMAC-SHA256 imposé par l'API ; service « oapi »,
# région de signature « eu-west-2 »).
name: outscale
description: "Outscale (3DS) — VM, BSU, OOS, EIM, security groups, OKS, LBU"

# Souveraineté du fournisseur (CLD-GVN-4) — faits ancrés. Cloud souverain FR,
# qualifié SecNumCloud 3.2 (immunité extraterritoriale reconnue par l'ANSSI).
souverainete:
  eu_etabli: true             # 3DS OUTSCALE, siège à Saint-Cloud (France)
  juridiction: FR
  controle_capitalistique: FR  # marque/filiale de Dassault Systèmes (France)
  secnumcloud: qualifie        # SecNumCloud 3.2 (ANSSI, déc. 2023) — 1er cloud public qualifié
  exposition_extraterritoriale: false
  sources: "3ds.com/newsroom (Outscale 1er cloud SecNumCloud 3.2) ; en.outscale.com/our-certifications"

auth:
  type: sigv4
  service: oapi
  region: eu-west-2
credentials:
  env:
    access_key: OSC_ACCESS_KEY
    secret_key: OSC_SECRET_KEY
    region: OSC_REGION
  file: { path: "~/.osc/config.json", format: osc }
  defaults: { region: eu-west-2, host: outscale.com }
s3:
  endpoint: "https://oos.{region}.outscale.com"
# Politiques EIM INLINE (attachées à un utilisateur) : chaîne ReadUsers → ReadUserPolicies
# → ReadUserPolicy, à 3 niveaux, inexprimable par le for_each mono-niveau du moteur.
# Sans elles, une policy inline « Action:* » échappe à TOUS les contrôles iam_policy_*
# (faux négatif vérifié : le contrôle passait au vert avec une telle policy en place).
eim:
  inline_policies: true
# OKS (Kubernetes managé) : API DISTINCTE de l'OAPI — host dédié, /api/v2, auth
# bi-en-têtes AccessKey/SecretKey. Collecteur Go (internal/oks) car le moteur YAML
# (SigV4, host unique) ne peut pas l'exprimer. Disponible en eu-west-2 (pas cloudgouv).
oks:
  endpoint: "https://api.{region}.oks.outscale.com"

# PERMISSIONS MINIMALES, unité de collecte par unité de collecte.
#
# Pourquoi ici et pas seulement dans la page du fournisseur : le scan doit pouvoir
# NOMMER la permission qui manque quand un endpoint refuse, et la page doit être
# DÉRIVÉE de la même donnée. Deux listes tenues en parallèle divergent, et celle
# qui diverge est toujours celle qu'on lit.
#
# `etat: verifie` engage : la permission est confirmée dans la source citée, un
# document officiel du fournisseur. `a_verifier` dit l'inverse, explicitement.
# AUCUNE de ces lignes n'a été confirmée par un scan réel avec un rôle réduit :
# ce dépôt ne détient aucun identifiant cloud, par construction.
#
# La politique EIM en lecture seule publiée par Outscale — `api:Read*` sur `*` —
# couvre TOUS les appels OAPI ci-dessous. Les actions sont énumérées pour dire
# lesquelles chaque unité exige, mais leur nom exact est INFÉRÉ de la syntaxe
# documentée `<service>:<APIMethod>`, pas recopié d'un catalogue d'actions.
permissions:
