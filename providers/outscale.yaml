collecte:
  # Collecte live Outscale PILOTÉE PAR YAML (moteur internal/collect, SigV4).
  # API OAPI : POST /api/v1/<Action> avec body JSON ; réponses en PascalCase.
  # Signature V4 (en-tête AWS4-HMAC-SHA256) : service "oapi", région "eu-west-2".
  # Ancré sur le contrat OAPI (github.com/outscale/osc-api). Plus de dépendance osc-sdk-go.
  base_url: https://api.{region}.{host}/api/v1
  resources:
    # Règles de security group (blocs InboundRules/OutboundRules de chaque SG).
    - type: security_group_rule
      path: /ReadSecurityGroups
      method: POST
      body: "{}"
      items: SecurityGroups[*].InboundRules[*]
      id: security_group_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      const: { direction: inbound, action: accept }
      map:
        security_group_id: _parent.SecurityGroupId
        security_group_name: _parent.SecurityGroupName
        protocol: IpProtocol
        cidrs: IpRanges
        port_from: FromPortRange
        port_to: ToPortRange
      transforms:
        protocol: [lower, { "-1": all, any: all, "": all, "1": icmp, "6": tcp, "17": udp }]
        cidrs: list
    - type: security_group_rule
      path: /ReadSecurityGroups
      method: POST
      body: "{}"
      items: SecurityGroups[*].OutboundRules[*]
      id: security_group_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      const: { direction: outbound, action: accept }
      map:
        security_group_id: _parent.SecurityGroupId
        security_group_name: _parent.SecurityGroupName
        protocol: IpProtocol
        cidrs: IpRanges
        port_from: FromPortRange
        port_to: ToPortRange
      transforms:
        protocol: [lower, { "-1": all, any: all, "": all, "1": icmp, "6": tcp, "17": udp }]
        cidrs: list
  
    # Machines.
    - type: compute_instance
      path: /ReadVms
      method: POST
      body: "{}"
      items: Vms
      id: vm_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        vm_id: VmId
        state: State
        deletion_protection: DeletionProtection
        # `PublicIp` ne couvre que la carte PRIMAIRE : une IP publique portée par une NIC
        # secondaire rendait la VM « publique » invisible au contrôle CLD-NET-3. On collecte
        # aussi les IP des NICs et la règle prend l'union (contrat : NicLight.LinkPublicIp).
        public_ip: PublicIp
        nic_public_ips: Nics
        security_group_ids: SecurityGroups
        user_data: UserData
        tags: Tags
      transforms:
        security_group_ids: pluck:SecurityGroupId
        nic_public_ips: [pluck:LinkPublicIp, pluck:PublicIp]
        tags: kv
  
    # Clés d'accès de NIVEAU COMPTE (appelant). ReadAccessKeys sans UserName renvoie les
    # clés de l'identité de scan ; si elle est le root (cas d'un scan account-owner/admin),
    # ce sont les clés du root. `scope: account` les marque pour la dérivation root_owned.
    - type: access_key
      path: /ReadAccessKeys
      method: POST
      body: "{}"
      items: AccessKeys
      id: access_key_id
      const: { scope: account }
      map:
        access_key_id: AccessKeyId
        state: State
        expiration_date: ExpirationDate

    # Clés d'accès des utilisateurs EIM (F4) : ReadAccessKeys UserName=<user>, pour CHAQUE
    # user EIM. Ces clés sont NON-root (attribuées à un user) — d'où `scope: eim`. Double
    # usage : (a) auditer leur expiration comme les autres clés ; (b) dériver root_owned
    # par DIFFÉRENCE (une clé scope:account absente de l'ensemble EIM appartient au root).
    # NB : un scan mené SOUS un user EIM est aveugle aux clés du root (limite d'API Outscale) ;
    # auditer les clés root exige des identifiants account-owner/admin.
    - type: access_key
      for_each:
        path: /ReadUsers
        method: POST
        body: "{}"
        items: Users
        as: user
        paging: { style: offset-body, param: FirstItem, size_param: ResultsPerPage, size: 100, more_path: HasMoreItems }
      path: /ReadAccessKeys
      method: POST
      body: '{"UserName":"{user.UserName}"}'
      items: AccessKeys
      id: access_key_id
      const: { scope: eim }
      map:
        access_key_id: AccessKeyId
        owner_user: _parent.UserName
        state: State
        expiration_date: ExpirationDate
  
    # Règles d'accès API (par IP).
    - type: api_access_rule
      path: /ReadApiAccessRules
      method: POST
      body: "{}"
      items: ApiAccessRules
      id: api_access_rule_id
      map:
        api_access_rule_id: ApiAccessRuleId
        ip_ranges: IpRanges
        ca_ids: CaIds
        cns: Cns
  
    # Résumé : nombre de règles d'accès API (agrégat → "aucune règle définie").
    - type: api_access_summary
      path: /ReadApiAccessRules
      method: POST
      body: "{}"
      items: ApiAccessRules
      aggregate: rule_count
      id: id
      const: { id: api-access }
  
    # Politique d'accès API (objet unique).
    - type: api_access_policy
      path: /ReadApiAccessPolicy
      method: POST
      body: "{}"
      items: ApiAccessPolicy
      id: id
      const: { id: api-access-policy }
      map:
        max_access_key_expiration_seconds: MaxAccessKeyExpirationSeconds
        require_trusted_env: RequireTrustedEnv
  
    # Volumes.
    - type: blockstorage_volume
      path: /ReadVolumes
      method: POST
      body: "{}"
      items: Volumes
      id: volume_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        volume_id: VolumeId
        state: State
        tags: Tags
      transforms:
        tags: kv
  
    # Snapshots (partage public via PermissionsToCreateVolume.GlobalPermission).
    # Filtré sur le compte (for_each ReadAccounts) : ReadSnapshots renvoie sinon les
    # snapshots « disponibles pour vous », y compris ceux PARTAGÉS PAR D'AUTRES comptes —
    # or un snapshot public d'un tiers n'est pas un écart actionnable ici (faux positif).
    # Même précaution que pour les images (F6).
    - type: blockstorage_snapshot
      for_each:
        path: /ReadAccounts
        method: POST
        body: "{}"
        items: Accounts
        as: acct
      path: /ReadSnapshots
      method: POST
      body: '{"Filters":{"AccountIds":["{acct.AccountId}"]}}'
      items: Snapshots
      id: snapshot_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        snapshot_id: SnapshotId
        volume_id: VolumeId
        creation_date: CreationDate
        state: State
        global_permission: PermissionsToCreateVolume.GlobalPermission
  
    # Politiques EIM : ReadPolicies puis ReadPolicyVersion (document JSON → statements).
    - type: iam_policy
      for_each:
        path: /ReadPolicies
        method: POST
        body: '{"Filters":{"Scope":"LOCAL"}}'
        items: Policies
        as: p
        paging: { style: offset-body, param: FirstItem, size_param: ResultsPerPage, size: 100, more_path: HasMoreItems }
      path: /ReadPolicyVersion
      method: POST
      body: '{"PolicyOrn":"{p.Orn}","VersionId":"{p.PolicyDefaultVersionId}"}'
      items: PolicyVersion
      id: policy_id
      map:
        policy_name: _parent.PolicyName
        policy_id: _parent.PolicyId
        statements: Body
      transforms:
        statements: iampolicy

    # Réseaux → network (cartographie, CLD-NET-5). Net = réseau virtuel Outscale
    # (IpRange en CIDR, State, Tags) ; on y crée des Subnets. Vocabulaire natif OAPI.
    - type: network
      path: /ReadNets
      method: POST
      body: "{}"
      items: Nets
      id: network_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        network_id: NetId
        cidr: IpRange
        state: State
        tags: Tags
      transforms:
        tags: kv

    # Appairages de Nets → network_peering (cloisonnement, CLD-NET-7). Un Net Peering
    # peut relier des Nets de comptes Outscale DIFFÉRENTS (doc about-net-peerings) :
    # source_account ≠ accepter_account ⇒ flux ouverts vers un autre SI.
    - type: network_peering
      path: /ReadNetPeerings
      method: POST
      body: "{}"
      items: NetPeerings
      id: peering_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        peering_id: NetPeeringId
        source_account: SourceNet.AccountId
        accepter_account: AccepterNet.AccountId
        state: State.Name

    # Sous-réseaux → subnet (exposition par défaut, CLD-NET-3). MapPublicIpOnLaunch=true
    # ⇒ IP publique attribuée d'office à toute interface créée dans le subnet. Champ
    # confirmé au contrat OAPI v1.41 (Subnet). Pas de filtre propriétaire nécessaire
    # (les subnets appartiennent au compte, contrairement aux images/snapshots).
    - type: subnet
      path: /ReadSubnets
      method: POST
      body: "{}"
      items: Subnets
      id: subnet_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        subnet_id: SubnetId
        map_public_ip_on_launch: MapPublicIpOnLaunch
        network_id: NetId
        state: State
        tags: Tags
      transforms:
        tags: kv

    # Répartiteurs de charge → load_balancer (CHF-1 TLS en clair, LOG-1 journal).
    # ReadLoadBalancers (pas de pagination). Les structures imbriquées (Listeners[],
    # AccessLog) sont en PascalCase au wire ; snake_keys les projette en snake_case
    # pour les règles agnostiques (qui lisent load_balancer_protocol, is_enabled).
    # Les VALEURS sont intactes : LoadBalancerProtocol="HTTPS" reste "HTTPS".
    - type: load_balancer
      path: /ReadLoadBalancers
      method: POST
      body: "{}"
      items: LoadBalancers
      id: load_balancer_name
      map:
        load_balancer_name: LoadBalancerName
        load_balancer_type: LoadBalancerType
        listeners: Listeners
        access_log: AccessLog
        tags: Tags
      transforms:
        listeners: snake_keys
        access_log: snake_keys
        tags: kv

    # Images machine → compute_image (STO-2, OMI partagée publiquement). CRUCIAL :
    # ReadImages sans filtre renvoie TOUTES les OMIs publiques du catalogue (des milliers)
    # → tempête de faux positifs. On filtre STRICTEMENT sur le compte via for_each
    # ReadAccounts (self.AccountId injecté dans Filters.AccountIds). Seules les OMIs
    # POSSÉDÉES par le compte sont auditées. public = PermissionsToLaunch.GlobalPermission.
    - type: compute_image
      for_each:
        path: /ReadAccounts
        method: POST
        body: "{}"
        items: Accounts
        as: acct
      path: /ReadImages
      method: POST
      body: '{"Filters":{"AccountIds":["{acct.AccountId}"]}}'
      items: Images
      id: image_id
      paging: { style: token-body, token_param: NextPageToken, token_path: NextPageToken, size_param: ResultsPerPage, size: 1000 }
      map:
        image_id: ImageId
        public: PermissionsToLaunch.GlobalPermission
        state: State
        tags: Tags
      transforms:
        tags: kv

mapping_terraform:
  # Mapping Terraform Outscale → modèle normalisé commun, DÉCLARATIF (moteur
  # internal/tfmap). Ancré sur le schéma réel du provider outscale/outscale.
  # Les règles de security group sont des ressources séparées (1:1) ; la policy EIM
  # porte un document JSON (effect/action/resource), normalisé en statements.
  resources:
    - tf_type: outscale_security_group_rule
      type: security_group_rule
      id: security_group_id
      const: { action: accept }
      map:
        security_group_id: security_group_id
        direction: flow                  # Inbound|Outbound
        protocol: ip_protocol            # -1/any/"" -> all
        cidrs: ip_range                  # plage d'adresses (schéma : ip_range, pas ip_ranges)
        port_from: from_port_range
        port_to: to_port_range
      transforms:
        direction: { Inbound: inbound, Outbound: outbound }
        protocol: [lower, { "-1": all, any: all, "": all, "1": icmp, "6": tcp, "17": udp }]
        cidrs: list                      # idempotent : liste gardée, string -> [string]
        port_from: range_from
        port_to: range_to
  
    # Forme alternative : bloc(s) `rules {}` (plusieurs règles dans une ressource ; flow et
    # security_group_id restent top-level). Sans ce mapping, ces règles seraient INVISIBLES.
    - tf_type: outscale_security_group_rule
      type: security_group_rule
      items: rules[*]
      id: security_group_id
      const: { action: accept }
      map:
        security_group_id: _parent.security_group_id
        direction: _parent.flow
        protocol: ip_protocol
        cidrs: ip_ranges                 # tableau de CIDR (schéma du bloc rules)
        port_from: from_port_range
        port_to: to_port_range
      transforms:
        direction: { Inbound: inbound, Outbound: outbound }
        protocol: [lower, { "-1": all, any: all, "": all, "1": icmp, "6": tcp, "17": udp }]
        cidrs: list
        port_from: range_from
        port_to: range_to

    - tf_type: outscale_vm
      type: compute_instance
      id: vm_id
      map:
        vm_id: vm_id
        public_ip: public_ip
        security_group_ids: security_group_ids
        state: state
        user_data: user_data              # Outscale UserData (base64) : secrets en clair (CLD-CMP-9)
        tags: tags
  
    - tf_type: outscale_policy
      type: iam_policy
      id: policy_name
      map:
        policy_name: policy_name
        statements: document             # document JSON {Statement:[...]}
      transforms:
        statements: iampolicy

    # Réseau → network (cartographie, CLD-NET-5).
    - tf_type: outscale_net
      type: network
      id: network_id
      map:
        network_id: net_id
        cidr: ip_range
        tags: tags
      transforms:
        tags: kv

    # Sous-réseau → subnet. map_public_ip_on_launch=true ⇒ IP publique auto (CLD-NET-3).
    # subnet_id NON mappé depuis ip_range (deux subnets de même CIDR dans des Nets distincts
    # fusionneraient) : id laissé au fallback res.Address de tfmap, unique par ressource.
    - tf_type: outscale_subnet
      type: subnet
      id: subnet_id
      map:
        map_public_ip_on_launch: map_public_ip_on_launch

    # Permission de lancement d'OMI → compute_image. permission_additions[].global_permission
    # (string "true"/"false" côté plan) ⇒ image publique (CLD-STO-2).
    - tf_type: outscale_image_launch_permission
      type: compute_image
      id: image_id
      map:
        image_id: image_id
        public: permission_additions.0.global_permission

# Contrat d'API (ancrage §2) + applicabilité SCSL (non_applicable) — lu par `pepin scsl`.
contrat:
  types:
    security_group_rule:
      etat: verifie
      source: SecurityGroup.{InboundRules,OutboundRules}[] (SecurityGroupRule)
      mapping:
        direction: Inbound|Outbound (liste) → inbound|outbound
        action: implicite « accept »
        protocol: IpProtocol (tcp|udp|icmp|-1) ; -1 → all
        port_from: FromPortRange (*int32)
        port_to: ToPortRange (*int32)
        cidrs: IpRanges (*[]string)
        security_group_id: SecurityGroupId
    compute_instance:
      etat: verifie
      source: Vm
      mapping:
        vm_id: VmId
        state: State
        public_ip: PublicIp
        security_group_ids: SecurityGroups[].SecurityGroupId
        user_data: UserData (base64)
        tags: Tags[] (ResourceTag{Key,Value})
    blockstorage_volume:
      etat: verifie
      source: Volume
      mapping:
        volume_id: VolumeId
        state: State
        tags: Tags[]
        encrypted: 'ABSENT : osc-sdk-go/v2 Volume n''expose AUCUN champ de chiffrement (vérifié sur le SDK).
          Le chiffrement au repos est CÔTÉ INVITÉ (EncFS/LUKS dans la VM), responsabilité du client
          (doc « Encrypting Data on Your Volumes ») → CLD-CHF-2 non observable côté plateforme, non applicable.'
    blockstorage_snapshot:
      etat: verifie
      source: Snapshot
      mapping:
        snapshot_id: SnapshotId
        volume_id: VolumeId
        creation_date: CreationDate
        state: 'State ∈ in-queue | pending | completed | error | deleting (schéma Snapshot de l''API
          OUTSCALE, osc-api/outscale.yaml). Seul « completed » désigne une snapshot TERMINÉE, donc
          exploitable : les autres sont en file, en cours, en erreur ou en suppression. Lu par
          blockstorage_volume_snapshots_exist (CLD-STO-3), qui vérifie l''état et pas seulement la date.'
        global_permission: PermissionsToCreateVolume.GlobalPermission
    object_storage_bucket:
      etat: verifie
      source: aws-sdk-go-v2/service/s3 (endpoint oos.<region>.outscale.com)
      mapping:
        acl_grants: GetBucketAcl → Grants[].{Grantee.URI, Permission}
        public_via_acl: 'DÉRIVÉ : grant AllUsers/AuthenticatedUsers'
        versioning: GetBucketVersioning → Status
        policy_public: 'DÉRIVÉ : GetBucketPolicy contient Allow Principal *'
        tags: GetBucketTagging → TagSet[]
    access_key:
      etat: verifie
      source: AccessKey
      mapping:
        access_key_id: AccessKeyId
        state: State
        expiration_date: ExpirationDate
        root_owned: DÉRIVÉ par différence d'ensembles — clé scope:account (ReadAccessKeys appelant) absente de l'ensemble scope:eim (ReadAccessKeys par user EIM). Auditer les clés root exige des identifiants account-owner/admin.
    iam_user:
      etat: absent
      source: osc-sdk-go User
      mapping:
        mfa_enabled: 'ABSENT par utilisateur : l''API EIM n''expose pas de statut MFA par user. La MFA Outscale s''impose
          au COMPTE via ApiAccessPolicy.RequireTrustedEnv (cf. type api_access_policy + contrôle iam_account_mfa_enforced).
          Source : docs.outscale.com (Multi-Factor Authentication).'
    iam_policy:
      etat: verifie
      source: Policy + PolicyVersion.Body (document JSON)
      mapping:
        policy_name: PolicyName
        statements: 'DÉRIVÉ : Body parsé → [{effect, actions[], resources[], not_action[], not_resource[]}]'
    load_balancer:
      etat: verifie
      source: >
        OAPI ReadLoadBalancers (live). Structures imbriquées PascalCase projetées en
        snake_case via le transform snake_keys (Listeners[].LoadBalancerProtocol,
        AccessLog.IsEnabled). Valeurs intactes (protocole "HTTPS" conservé).
      mapping:
        load_balancer_name: LoadBalancerName
        load_balancer_type: LoadBalancerType (internet-facing|internal)
        listeners: Listeners[].{LoadBalancerProtocol, LoadBalancerPort} (snake_keys)
        access_log: AccessLog.IsEnabled (snake_keys)
    network:
      etat: verifie
      source: 'Net (ReadNets → Nets[]) : réseau virtuel Outscale. Doc locale about-nets.'
      mapping:
        network_id: NetId
        cidr: IpRange (CIDR RFC 1918)
        state: State
        tags: Tags[] (ResourceTag{Key,Value}) → cartographie CLD-NET-5
    network_peering:
      etat: verifie
      source: 'Net Peering (ReadNetPeerings → NetPeerings[]) : {NetPeeringId, SourceNet.AccountId, AccepterNet.AccountId,
        State.Name}. Un peering peut relier des comptes Outscale différents (doc about-net-peerings) → CLD-NET-7.'
      mapping:
        peering_id: NetPeeringId
        source_account: SourceNet.AccountId
        accepter_account: AccepterNet.AccountId
        state: State.Name
    api_access_rule:
      etat: verifie
      source: ApiAccessRule
      mapping:
        api_access_rule_id: ApiAccessRuleId
        ip_ranges: IpRanges (*[]string)
    api_access_summary:
      etat: verifie
      source: ReadApiAccessRules (agrégat rule_count sur la même réponse que api_access_rule)
      mapping:
        rule_count: len(ApiAccessRules)
    api_access_policy:
      etat: verifie
      source: ApiAccessPolicy
      mapping:
        max_access_key_expiration_seconds: MaxAccessKeyExpirationSeconds (*int64)
        require_trusted_env: 'RequireTrustedEnv (*bool) ; true ⇒ MFA imposée à tous les EIM users (WebAuthn/OTP). Source :
          docs.outscale.com (About Your API Access Policy).'
    kubernetes_cluster:
      etat: verifie
      source: >
        API OKS live (collecteur Go internal/oks, GET /api/v2/clusters/all, auth bi-en-têtes) :
        admin_whitelist, cp_multi_az→control_plane_multi_az, disable_api_termination→deletion_protection,
        auto_maintenances.minor_upgrade_maintenance.enabled→auto_upgrade, version. Champs confirmés
        sur des clusters réels (eu-west-2).
      journalisation: 'CAPACITÉ CONFIRMÉE (doc OKS « Managing Cluster Logs ») : les logs d''audit ET d''infrastructure du
        cluster sont générés AUTOMATIQUEMENT et stockés dans des buckets OOS ; l''accès se gère via la ressource OOSAccess
        (comptes autorisés en lecture, emplacement de stockage). Sémantique DIFFÉRENTE d''Exoscale (audit opt-in via endpoint) :
        l''audit OKS étant automatique, le check kubernetes_cluster_audit_logging_enabled (« audit activé », CLD-LOG-1) serait
        toujours satisfait et n''apporterait rien ; l''angle pertinent pour Outscale serait la PROTECTION des logs (OOSAccess),
        à formaliser en check distinct si visé. Nom exact des champs API OKS à confirmer (schéma oks.html rendu en JS).'
    subnet:
      etat: verifie
      source: >
        Terraform outscale_subnet (mapping validé par un plan réel : attribut
        map_public_ip_on_launch, doc outscale/terraform-provider-outscale). API live
        ReadSubnets MapPublicIpOnLaunch à câbler en collecte.
      mapping:
        subnet_id: id API (computed) ; sujet = res.Address au stade plan (fallback tfmap)
        map_public_ip_on_launch: MapPublicIpOnLaunch (bool)
    compute_image:
      etat: verifie
      source: >
        Terraform outscale_image_launch_permission (permission_additions[].global_permission).
        API LIVE : ReadImages filtré sur le compte (for_each ReadAccounts → Filters.AccountIds=self,
        IMPÉRATIF pour ne pas flaguer les OMIs publiques du catalogue) ;
        public = PermissionsToLaunch.GlobalPermission.
      mapping:
        image_id: ImageId
        public: PermissionsToLaunch.GlobalPermission (bool ; "true"/"false" côté plan)
  non_applicable:
  # CHF-2 : osc-sdk-go/v2 Volume n'expose aucun champ de chiffrement ; le chiffrement
  # au repos est CÔTÉ INVITÉ (EncFS/LUKS), responsabilité du client → non observable
  # côté plateforme.
  - control: blockstorage_volume_encryption
    reason: "osc-sdk-go/v2 Volume n'expose aucun champ de chiffrement ; le chiffrement au repos est côté invité (EncFS/LUKS), responsabilité du client → non observable côté plateforme (CHF-2)."
    reason_en: "osc-sdk-go/v2 Volume exposes no encryption field; encryption at rest is guest-side (EncFS/LUKS), a customer responsibility, hence unobservable on the platform side (CHF-2)."
  # CHF-4 : OOS ServerSideEncryption est TOUJOURS AES256 (clé fournisseur) ; aucun
  # service KMS ni clé client au niveau objet (doc OOS) → BYOK non applicable.
  # CHF-4 : distinguer SSE et BYOK. Le SSE existe chez OOS et il est OPT-IN par bucket
  # (donc observable, et un bucket peut l'avoir désactivé) — ce N/A ne porte QUE sur
  # l'absence de clé gérée par le client.
  - control: objectstorage_bucket_kms_encryption
    reason: "OOS chiffre côté serveur en AES256 avec une clé FOURNISSEUR ; il n'existe ni service KMS ni clé maître gérée par le client, donc pas de BYOK à auditer au niveau bucket (CHF-4). NB : l'activation du SSE elle-même est opt-in et observable — elle relève d'un contrôle distinct, pas de ce N/A."
    reason_en: "OOS encrypts server-side in AES256 with a PROVIDER key; there is neither a KMS service nor a customer-managed master key, so there is no BYOK to audit at the bucket level (CHF-4). Note: enabling SSE itself is opt-in and observable, which is a separate control, not this N/A."
  # CHF-1 : `Listener` et `ListenerRule` EXISTENT bien au contrat — l'affirmation inverse
  # était fausse et réfutable en une recherche. Le fait exact est que `ListenerRule.Action`
  # est documenté « always forward » : la règle ne sait que transmettre, aucune action de
  # redirection n'existe. Le mécanisme est donc absent, mais pour cette raison-là.
  - control: loadbalancer_http_redirect_to_https
    reason: "Le LBU Outscale ne peut pas rediriger : `ListenerRule.Action` est documenté « always forward » au contrat OAPI (aucune action de redirection), et aucun attribut de redirection n'existe sur `Listener`. Le mécanisme est inexistant → contrôle non applicable (CHF-1)."
    reason_en: "The Outscale LBU cannot redirect: `ListenerRule.Action` is documented as \"always forward\" in the OAPI contract (no redirect action), and no redirect attribute exists on `Listener`. The mechanism does not exist, so the control is not applicable (CHF-1)."
