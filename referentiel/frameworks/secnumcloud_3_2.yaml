code: secnumcloud_3_2
name: SecNumCloud — Prestataires de services cloud
version: "3.2"
url: https://cyber.gouv.fr/sites/default/files/document/secnumcloud-referentiel-exigences-v3.2.pdf
description: |
  Référentiel d'exigences applicables aux prestataires de services d'informatique
  en nuage (SecNumCloud), version 3.2 du 08/03/2022, publié par l'ANSSI. Les
  exigences sont réparties sur les chapitres 5 à 19 (structure calquée sur l'annexe
  A d'ISO/IEC 27001, augmentée d'exigences additionnelles au chapitre 19).
  Ce catalogue ne référence QUE les sous-sections observables au niveau de la
  configuration d'un tenant IaaS : les intitulés sont repris VERBATIM de la table
  des matières officielle (chapitres 8 à 19). Les exigences organisationnelles ou
  contractuelles (revues, procédures, relations tiers…) sortent du périmètre d'un
  scanner de posture et ne sont pas mappées (cf. gaps.md, bucket D).

controls:
  # ── 8. Gestion des actifs ──
  - id: "8.1"
    title: Inventaire et propriété des actifs
    description: Un inventaire des actifs est tenu à jour et chaque actif dispose d'un propriétaire identifié.

  # ── 9. Contrôle d'accès et gestion des identités ──
  - id: "9.1"
    title: Politiques et contrôle d'accès
    description: Une politique de contrôle d'accès applique le moindre privilège et le besoin d'en connaître.
  - id: "9.3"
    title: Gestion des droits d'accès
    description: L'attribution et le retrait des droits d'accès sont maîtrisés et limités au strict nécessaire.
  - id: "9.5"
    title: Gestion des authentifications des utilisateurs
    description: Les moyens d'authentification sont gérés de façon sécurisée (robustesse, cycle de vie, second facteur).
  - id: "9.6"
    title: Accès aux interfaces d'administration
    description: Les interfaces d'administration ne sont accessibles que depuis des sources maîtrisées et authentifiées fortement.
  - id: "9.7"
    title: Restriction des accès à l'information
    description: L'accès à l'information est restreint aux seules entités légitimes.

  # ── 10. Cryptologie ──
  - id: "10.1"
    title: Chiffrement des données stockées
    description: Les données stockées sensibles sont chiffrées au repos avec des mécanismes conformes.
  - id: "10.2"
    title: Chiffrement des flux
    description: Les flux transportant des données sensibles sont chiffrés (TLS ≥ 1.2, suites robustes).
  - id: "10.5"
    title: Gestion des secrets
    description: Les secrets (clés, mots de passe, certificats) sont protégés, cloisonnés et renouvelés.

  # ── 12. Sécurité liée à l'exploitation ──
  - id: "12.5"
    title: Sauvegarde des informations
    description: Les informations sont sauvegardées selon une politique documentée et testées en restauration.
  - id: "12.6"
    title: Journalisation des événements
    description: Les événements de sécurité sont journalisés, horodatés et conservés.
  - id: "12.7"
    title: Protection de l'information journalisée
    description: Les journaux sont protégés en intégrité et contre la suppression ou l'altération.
  - id: "12.11"
    title: Gestion des vulnérabilités techniques
    description: Les vulnérabilités techniques sont identifiées et corrigées dans des délais maîtrisés.

  # ── 13. Sécurité des communications ──
  - id: "13.1"
    title: Cartographie du système d'information
    description: Le système d'information est cartographié (ressources, flux, zones de confiance).
  - id: "13.2"
    title: Cloisonnement des réseaux
    description: Les réseaux sont cloisonnés et les flux entre zones de confiance filtrés par défaut.
  - id: "13.3"
    title: Surveillance des réseaux
    description: Les réseaux sont surveillés pour détecter les flux et comportements anormaux.

  # ── 17. Continuité d'activité ──
  - id: "17.4"
    title: Disponibilité des moyens de traitement de l'information
    description: Les moyens de traitement disposent d'une redondance suffisante pour respecter les objectifs de disponibilité.
  - id: "17.6"
    title: Mise à disposition d'un dispositif de sauvegarde des données du commanditaire
    description: Un dispositif permet au commanditaire de sauvegarder et restaurer ses données.

  # ── 19. Exigences supplémentaires ──
  - id: "19.2"
    title: Localisation des données
    description: Les données, y compris les sauvegardes, sont stockées et traitées au sein de l'Union européenne.
  - id: "19.6"
    title: Protection vis-à-vis du droit extra-européen
    description: Le prestataire n'est pas soumis à un droit extra-européen susceptible de contraindre l'accès aux données (capital, gouvernance, sous-traitance).
