why: |
  Personne, dans ce dépôt, n'a écrit une base de données ni un bucket pour éprouver
  une règle de Pépin : l'auteur voulait un entrepôt DuckLake qui démarre. Les écarts
  que Pépin y relève (sauvegardes désactivées, service ouvert, verrou d'objet absent)
  sont donc des écarts qu'une configuration réelle porte, pas des écarts qu'une
  fixture a mis là pour être trouvés.
why_en: |
  Nobody in that repository wrote a database or a bucket to exercise a Pepin rule:
  the author wanted a DuckLake warehouse that boots. The deviations Pepin reports
  there (backups disabled, service reachable, no object lock) are therefore
  deviations a real configuration carries, not deviations a fixture placed to be
  found.
