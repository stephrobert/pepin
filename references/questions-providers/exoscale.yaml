- id: EXO-Q4
  titre: Contrôle capitalistique ultime (souveraineté GOV-4)
  controle: CLD-GOV-4 / governance_provider_sovereignty
  statut: ouverte
  contexte: >
    GOV-4 exige un fournisseur soustrait à un contrôle capitalistique extra-UE
    déterminant. Exoscale (Akenes SA, CH) appartient à A1 Digital / A1 Telekom
    Austria (Autriche, UE). Le siège CH (hors UE) déclenche déjà GOV-4.
  ce_quon_sait: >
    A1 Telekom Austria Group est coté à Vienne ; un actionnaire de référence
    extra-UE (América Móvil, Mexique) est notoirement présent — à confirmer et
    qualifier (part de contrôle « déterminante » ?).
  a_confirmer: >
    L'actionnariat ultime d'A1 Telekom Austria constitue-t-il un contrôle extra-UE
    déterminant ? Si oui, passer controle_capitalistique=extra_ue dans
    providers/exoscale.yaml (actuellement a_verifier, pas de faux positif).
  source:
    - https://www.exoscale.com/about-us/
    - https://www.a1.digital/european-cloud/

- id: EXO-Q5
  titre: Audit des rôles IAM prédéfinis (non éditables)
  controle: CLD-IAM-1/2/4 / iam_role_*
  statut: ouverte
  contexte: >
    Le scan live remonte des findings IAM-4/1/2 sur des rôles PRÉDÉFINIS Exoscale
    (ex. « Billing », « Owner ») dont la policy n'est pas modifiable par le client.
  decision_provisoire: >
    Les checks iam_role_* ne s'appliquent qu'aux rôles éditables (editable=true) ;
    les rôles prédéfinis (editable=false) sont exclus comme non actionnables — la
    doc role-mgmt confirme « policy modifiable seulement si Editable (défaut true) ».
  a_confirmer: >
    (1) Liste exhaustive des rôles prédéfinis Exoscale et leur permissivité réelle
    (Billing/Owner/Read-only…) — la doc ne l'énumère pas. (2) Faut-il les IGNORER
    totalement (choix actuel) ou les signaler en INFORMATION ? Un rôle prédéfini
    permissif assigné à une clé reste un risque — le risque est alors dans
    l'ASSIGNATION de la clé au rôle, pas dans le rôle lui-même.
  source:
    - references/docs/exoscale/product-iam-how-to-role-mgmt.md
