# Questions ouvertes — Exoscale. Voir README.md pour le cycle de vie.

- id: EXO-Q1
  titre: Expiration / durée de vie limitée des clés d'API
  controle: CLD-IAM-2 / iam_accesskey_expiration_set
  statut: resolue
  contexte: >
    CLD-IAM-2 demande des clés d'API à durée de vie limitée.
  reponse: >
    ANCRÉ (cache local, 2026-06-12). Les clés API Exoscale sont PERMANENTES : le
    schéma iam-api-key ne porte que {key, name, role-id} (aucune date d'expiration).
    La durée de vie se borne au niveau du RÔLE référencé, par DEUX moyens documentés :
    (1) champ structuré `max-session-ttl` du rôle (TTL max d'une session assumée) ;
    (2) expression CEL dans la policy du rôle, ex. action deny si
    `timestamp(identity.created) < timestamp(now) - duration('5m')`
    (exemple officiel « time-expiring IAM Key », policy-guide). Donc IAM-2 est
    COMBLABLE chez Exoscale, mais via le rôle (sessions), pas via la clé elle-même —
    nuance de sémantique à acter pour la modélisation du check.
  source:
    - references/docs/exoscale/product-iam-how-to-policy-guide.md   # ex. expiration L478-499
    - references/docs/exoscale/reference-api-schemas-iam-api-key.md  # {key,name,role-id}
    - references/docs/exoscale/reference-api-schemas-iam-role.md     # policy + max-session-ttl

- id: EXO-Q3
  titre: Clé de chiffrement gérée par le client au niveau bucket (SSE-KMS / BYOK)
  controle: CLD-CHF-4 / objectstorage_bucket_kms_encryption
  statut: a_surveiller
  contexte: >
    CLD-CHF-4 demande des clés de chiffrement gérées par le client (BYOK/HYOK) pour
    les données sensibles. L'angle observable retenu = chiffrement par défaut du
    bucket via clé client (SSE-KMS), lu via GetBucketEncryption.
  reponse: >
    ANCRÉ (cache local). SOS n'offre aujourd'hui que SSE-C (clé fournie par le client
    PAR-OBJET, non observable au niveau bucket ; « Exoscale does not store your keys »).
    SSE-KMS est explicitement « planned for future release » → CHF-4 marqué non
    applicable pour Exoscale (capacité bucket-level absente à ce jour).
  suite: >
    RÉÉVALUER quand le KMS Exoscale sortira (la doc encryption sera mise à jour) :
    activer alors `s3.sse_kms: true` dans providers/exoscale.yaml et retirer
    objectstorage_bucket_kms_encryption de contrat.non_applicable.
  source:
    - references/docs/exoscale/product-storage-object-storage-how-to-encryption.md
    - references/docs/exoscale/reference-api-kms-kms-key.md

- id: EXO-Q2
  titre: Restriction d'accès par IP source
  controle: CLD-IAM-4 / iam_apiaccessrule_no_public_cidr
  statut: resolue
  contexte: >
    CLD-IAM-4 demande une restriction d'accès par CIDR ; pas d'« ApiAccessRule par
    IP » dédiée chez Exoscale.
  reponse: >
    ANCRÉ (cache local, 2026-06-12). La restriction par IP s'exprime DANS la policy
    CEL du rôle IAM, via les bindings `source_ip` : `source_ip.inIpRange('<CIDR>')`,
    `source_ip == '<ip>'`, ou `source_ip in ['<ip>', …]` (policy-guide, bindings +
    exemples). Lisible en collecte via list-iam-roles → policy. Le check consiste à
    détecter l'ABSENCE de borne source_ip dans la policy d'un rôle.
  source:
    - references/docs/exoscale/product-iam-how-to-policy-guide.md   # bindings L52/L155, ex. L242

