name: campaigns

# Les campagnes qui CHERCHENT, par opposition aux portes qui vérifient.
#
# Une porte répond « ce commit tient-il ». Une campagne répond « que trouve-t-on
# si l'on cherche assez longtemps ». Les deux sont nécessaires et n'ont pas le
# même rythme : mettre une campagne sur le chemin d'une pull request la rend
# assez lente pour qu'on la contourne, et assez bruyante pour qu'on l'ignore.
#
# D'où ce fichier, hebdomadaire et déclenchable à la main. Ce qu'il trouve
# devient une graine versionnée ou une issue — jamais un échec qu'on referme
# en relançant.
#
# Le rejeu des specs de FALSIFICATION vivait ici, et c'était un classement par
# famille d'outillage plutôt que par nature. Il applique un jeu FIXE de mutations
# et rend le même verdict sur la même entrée : il répond « ce commit tient-il »,
# donc c'est une porte. Il est passé dans `ci.yml`, où il tourne sur chaque pull
# request pour 3 min 27 s mesurées — en parallèle d'un `Build + Test` de 8 min,
# donc sans rien ajouter à l'attente. Le classement avait laissé une garde tenir
# treize jours sans mordre.
#
# Ce qui reste ici est ce qui CHERCHE vraiment, et les deux raisons de l'en-tête
# lui restent entières : vingt minutes de fuzzing délibéré, et la possibilité de
# rougir sur une trouvaille sans aucun rapport avec la pull request en cours.
on:
  schedule:
    # Lundi matin : ce qui est trouvé a la semaine pour être traité.
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Durée de fuzzing par cible"
        required: false
        default: '10m'

concurrency:
  group: campaigns-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Le fuzzing des parseurs d'entrée non fiable. `CLAUDE.md` §5 exige qu'ils
  # parsent défensivement et ne paniquent jamais ; c'est ici qu'on le cherche
  # plutôt que de l'espérer. Une entrée qui fait tomber une cible est écrite par
  # Go dans testdata/fuzz/ : elle doit être committée, et elle garde alors ce
  # cas pour toujours.
  fuzz:
    name: Les parseurs tiennent-ils une entrée hostile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Corpus de départ
        run: |
          for d in internal/tfparse/testdata/fuzz/FuzzParsePlan cmd/testdata/fuzz/FuzzInventoryWalk; do
            echo "$d : $(find "$d" -type f | wc -l) graine(s) versionnée(s)"
          done

      - name: Campagne de fuzzing
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}
        run: |
          go test ./internal/tfparse/ -run '^$' -fuzz 'FuzzParsePlan'    -fuzztime="$FUZZTIME"
          go test ./cmd/            -run '^$' -fuzz 'FuzzInventoryWalk' -fuzztime="$FUZZTIME"

      # Les trouvailles d'une campagne vivent dans GOCACHE, qui disparaît avec le
      # runner. Mesuré sur ce dépôt : 125 entrées intéressantes en vingt-cinq
      # secondes, deux graines versionnées — chaque campagne repartait donc de deux
      # graines et refaisait le chemin de la précédente. On les conserve TOUJOURS,
      # pas seulement à l'échec : une campagne qui passe a exploré, et cette
      # exploration est le travail qu'on perdait.
      #
      # Conserver n'est pas promouvoir. Ce que le corpus VERSIONNÉ accepte se décide
      # par `mise run fuzz-promote`, qui éprouve chaque graine avant de l'accepter —
      # parce qu'une graine qui fait tomber sa cible rendrait `main` rouge, et
      # qu'elle doit entrer avec la correction qu'elle motive, jamais avant.
      - name: Conserver ce que la campagne a exploré
        if: always()
        run: |
          cache="$(go env GOCACHE)/fuzz"
          mkdir -p /tmp/fuzz-cache
          [ -d "$cache" ] && cp -r "$cache/." /tmp/fuzz-cache/ || true
          find /tmp/fuzz-cache -type f | wc -l | xargs echo "entrées conservées :"

      - name: Publier le corpus exploré
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: |
            /tmp/fuzz-cache/
            internal/tfparse/testdata/fuzz/
            cmd/testdata/fuzz/
          if-no-files-found: ignore
