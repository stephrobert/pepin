name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --exclude-paths .trufflehogignore

  # trufflehog tourne en --only-verified : il n'escalade que ce qu'une API vivante
  # confirme, et il n'a AUCUN détecteur pour Exoscale, Outscale ni Scaleway —
  # c'est-à-dire exactement les trois clouds au cœur de ce dépôt. Une vraie clé
  # souveraine committée passerait donc ce job en silence. gitleaks travaille par
  # motif, sans vérification réseau : il couvre ce point aveugle.
  gitleaks:
    name: Secret scanning (pattern-based)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise (outils + tâches)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Épinglée, comme toute autre dépendance de la chaîne (ADR-0016). Sans
          # `version`, l'action résout vers la DERNIÈRE étiquette — et une étiquette
          # peut exister avant que ses binaires ne soient publiés : v2026.9.3 a rendu
          # 404 sur cinq tentatives et cassé toutes les PR. Monter cette version est
          # un geste délibéré, pas un effet de bord du calendrier de l'amont.
          version: 2026.9.2

      # Via mise plutôt que l'action gitleaks : la version est épinglée dans
      # mise.toml comme opa et terraform, et le scan reste identique en local.
      - name: gitleaks
        run: mise run secrets
