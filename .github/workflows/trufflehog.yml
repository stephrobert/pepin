name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --exclude-paths .trufflehogignore

  # trufflehog tourne en --only-verified : il n'escalade que ce qu'une API vivante
  # confirme, et il n'a AUCUN détecteur pour Exoscale, Outscale ni Scaleway —
  # c'est-à-dire exactement les trois clouds au cœur de ce dépôt. Une vraie clé
  # souveraine committée passerait donc ce job en silence. gitleaks travaille par
  # motif, sans vérification réseau : il couvre ce point aveugle.
  gitleaks:
    name: Secret scanning (pattern-based)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise (outils + tâches)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # Via mise plutôt que l'action gitleaks : la version est épinglée dans
      # mise.toml comme opa et terraform, et le scan reste identique en local.
      - name: gitleaks
        run: mise run secrets
