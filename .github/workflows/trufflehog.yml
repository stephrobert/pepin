name: trufflehog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --exclude-paths .trufflehogignore

  # trufflehog tourne en --only-verified : il n'escalade que ce qu'une API vivante
  # confirme, et il n'a AUCUN détecteur pour Exoscale, Outscale ni Scaleway —
  # c'est-à-dire exactement les trois clouds au cœur de ce dépôt. Une vraie clé
  # souveraine committée passerait donc ce job en silence. gitleaks travaille par
  # motif, sans vérification réseau : il couvre ce point aveugle.
  gitleaks:
    name: Secret scanning (pattern-based)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise (outils + tâches)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # Via mise plutôt que l'action gitleaks : la version est épinglée dans
      # mise.toml comme opa et terraform, et le scan reste identique en local.
      - name: gitleaks
        run: mise run secrets
