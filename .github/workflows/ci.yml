name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup mise (outils + tâches)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Épinglée, comme toute autre dépendance de la chaîne (ADR-0016). Sans
          # `version`, l'action résout vers la DERNIÈRE étiquette — et une étiquette
          # peut exister avant que ses binaires ne soient publiés : v2026.9.3 a rendu
          # 404 sur cinq tentatives et cassé toutes les PR. Monter cette version est
          # un geste délibéré, pas un effet de bord du calendrier de l'amont.
          version: 2026.9.2
          experimental: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: mise run build

      - name: Vet
        run: mise run vet

      - name: Go unit tests
        run: mise run test-go

      - name: Rego policy tests
        run: mise run test-rego

      - name: Smoke test — providers
        run: ./pepin provider list

      - name: Smoke test — scan non conforme (exit 1 attendu)
        run: ./pepin scan scaleway examples/scaleway/inventory.json || test $? -eq 1

      - name: Smoke test — scan conforme (exit 0 attendu)
        run: ./pepin scan scaleway examples/scaleway/inventory-ok.json

      - name: OSCAL conforme au schéma NIST 1.1.2
        run: |
          # Outil tiers et schema figes : sans version ni empreinte, ce job execute
          # a chaque fois du code et des donnees qu'il n'a pas choisis.
          pipx install 'check-jsonschema==0.38.0'
          curl -sSL --retry 3 -o oscal-ar.json https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_assessment-results_schema.json
          echo "d033da70154cf6625ae46a746199e88e58f2928b1387dfac051d381b92f41b0d  oscal-ar.json" | sha256sum -c -
          # `|| true` : un scan non conforme sort 1, ce qui est le comportement
          # attendu ici — c'est la validite OSCAL qu'on mesure, pas la posture.
          ./pepin scan scaleway examples/scaleway/inventory.json --format oscal > out.oscal.json || true
          check-jsonschema --schemafile oscal-ar.json out.oscal.json

  # CLAUDE.md §5 pose que gosec et govulncheck doivent passer. Aucun workflow ne
  # les invoquait : la porte n'existait que comme convention locale, et elle etait
  # rouge (5 vulnerabilites stdlib atteignables au moment de l'audit).
  audit:
    name: Audit (gosec + govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Actions officielles ÉPINGLÉES par SHA plutôt que `go install @version` :
      # Dependabot ne lit pas mise.toml, alors qu'il suit l'écosystème
      # github-actions. Un outil de sécurité installé sans suivi vieillit en
      # silence — le reproche même qu'on fait à un digest non surveillé.
      # OSV n'est pas repris ici : osv-scanner.yml le couvre déjà, en PR et en
      # scan planifié (les paquets reclassés MAL- après coup).
      - name: Sécurité du code (gosec)
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: -quiet ./...

      # La version de Go vient de go.mod, et il faut la passer par `go-version-input`.
      # `go-version-file` seul était IGNORÉ : l'action porte un `go-version-input`
      # défaut « stable » qu'elle transmet à setup-go, lequel avertit « only
      # go-version will be used ». govulncheck analysait donc le code sous une
      # version que le projet ne cible pas — ce qui compte, l'applicabilité d'une
      # vulnérabilité de la bibliothèque standard dépendant de cette version.
      #
      # `cache: false` parce que setup-go a DÉJÀ restauré le cache Go plus haut :
      # deux restaurations dans le même job déballent l'une sur l'autre, d'où les
      # « Cannot open: File exists » et l'échec de tar en fin de job.
      - name: Version de Go du projet
        id: gomod
        run: echo "version=$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Vulnérabilités appelées (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.gomod.outputs.version }}
          cache: false
          repo-checkout: false

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
