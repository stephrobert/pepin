name: sbom

on:
  push:
    branches: [main]

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: pepin.spdx.json
          artifact-name: pepin.spdx.json
          upload-artifact: true
          # release.yml produit et attache deja le SBOM de la release ;
          # ce job ne sert qu'a suivre la SBOM de main.
          upload-release-assets: false
