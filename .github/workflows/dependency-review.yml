name: dependency-review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # La liste de refus protège le PRODUIT distribué (Apache-2.0) d'une
          # contamination copyleft. Elle ne vise pas l'outillage de CI.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # trufflehog est une ACTION exécutée par la CI, jamais liée ni distribuée
          # avec le binaire : son AGPL-3.0 ne se propage pas au produit. L'exception
          # est nominative — la politique reste entière pour tout le reste, et en
          # particulier pour les dépendances Go, qui elles sont bien distribuées.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
