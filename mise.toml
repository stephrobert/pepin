# Pépin — outillage et tâches, pilotés par mise (https://mise.jdx.dev).
# Remplace le Makefile : `mise run <tâche>` (ou `mise run` pour la liste).
# Build/test/audit/validate sont les portes de qualité (cf. CLAUDE.md §1).

[tools]
opa = "1.18.2"        # tests des règles Rego : ALIGNÉ sur la lib OPA du runtime (go.mod)
terraform = "1.15.4"  # validation des preuves de remédiation + mapping TF
gitleaks = "8.30.0"   # scan de secrets par MOTIF : couvre les clés souveraines,
                      # que trufflehog --only-verified ne sait pas reconnaître

[tasks.build]
description = "Compile le binaire (version injectée)"
run = 'go build -trimpath -ldflags "-s -w -X github.com/stephrobert/pepin/cmd.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" -o pepin .'

[tasks.test]
description = "Tests Go (data races) + tests des règles Rego"
depends = ["test-go", "test-rego"]

[tasks.test-go]
description = "Tests unitaires Go avec détecteur de data races"
run = "go test ./... -race"

[tasks.test-rego]
description = "Tests des politiques Rego (toutes communes)"
run = "opa test internal/commonrules/rules -v"

# `Config` sélectionne les gardes de l'issue #65 : une contrainte de configuration
# ininterprétable (réglage inconnu, sens de contrainte inexistant) est refusée ici,
# parce qu'une contrainte que personne n'évalue est pire qu'une contrainte absente —
# elle donne l'impression que la correspondance normative est protégée.
# `Finding` sélectionne TestEveryFindingCarriesRemediation, qui exige de chaque
# règle sa remédiation ET ses deux labels de traduction (message_en,
# remediation_en). C'est une vérification purement statique du texte des .rego :
# elle a sa place dans la porte de cohérence, à côté de celle du référentiel.
[tasks.validate]
description = "Cohérence des référentiels (codes ↔ règles ↔ index SCSL gelé ↔ catalogue ↔ bilinguisme)"
run = "go test ./referentiel/ -run 'Control|Rule|SCSL|Catalogue|Lookup|Coherent|Finding|Config' -v"

# check-remediation est volontairement DÉCOUPLÉ de `validate` : la couverture est
# aujourd'hui de 26/95 (exoscale 26/26, outscale 0/40, scaleway 0/25, kubernetes 0/4),
# et une porte rouge en permanence est une porte qu'on apprend à ignorer.
# La condition « un provider à 100 % » est TENUE par exoscale, et l'acquis est gardé par
# TestExoscaleRemediationCoverageStaysComplete (internal/docgen), qui tourne dans
# `mise run test` : un contrôle exoscale sans preuve casse la CI. Les fournisseurs
# suivants rejoindront cette garde en atteignant 100 %. À NE PAS confondre avec la
# remédiation TEXTUELLE portée par chaque finding, elle garantie par
# TestEveryFindingCarriesRemediation (referentiel/validate_test.go).
[tasks.check-remediation]
description = "Présence d'une preuve de remédiation par (contrôle, fournisseur) sous references/remediation/"
run = "python3 scripts/check-remediation.py"

[tasks.scsl]
description = "Rapport de cohérence avec l'index SCSL + roadmap"
depends = ["build"]
run = "./pepin scsl"

[tasks.gen-scsl]
description = "(Re)génère les exigences SCSL fines dans framework-scsl"
run = "python3 scripts/gen-scsl-cloud.py"

# La documentation dérivée (matrice de couverture, sorties de commande montrées dans docs/)
# est GÉNÉRÉE, jamais recopiée : une page recopiée diverge au premier contrôle ajouté, et une
# doc de CSPM qui ment sur sa couverture est pire que pas de doc.
# La VÉRIFICATION n'est volontairement pas une tâche séparée qu'on peut oublier : c'est
# TestGeneratedDocsAreUpToDate (internal/docgen), donc `mise run test` et la CI.
[tasks.gen-docs]
description = "Régénère docs/coverage.md et les régions générées des pages de docs/"
depends = ["build"]
run = "go run ./tools/docgen -root ."

[tasks.fetch-docs]
description = "Met en cache la doc officielle des providers en Markdown (trafilatura)"
run = "python3 scripts/fetch-docs.py"

# Convention de sortie des outils de dérive et de release (distincte de celle de
# `pepin scan`, où 2 est l'erreur technique) : 0 rien à signaler · 1 erreur ·
# 2 dérive non triée. La CI et le preflight distinguent les trois.
[tasks.scsl-drift]
description = "Dérive de l'index SCSL vivant depuis la baseline versionnée (exit 2 = dérive à trier)"
run = "python3 scripts/scsl-drift.py"

[tasks.scsl-drift-update]
description = "Réécrit la baseline SCSL depuis l'index vivant, APRÈS triage humain des écarts"
run = "python3 scripts/scsl-drift.py --update"

# Le contrat de véracité (issue #43) : chaque chemin contrôle × fournisseur × source
# doit prouver, de bout en bout et à travers le binaire, les verdicts qu'il peut
# atteindre. Ce qui n'est pas prouvé est CONSIGNÉ, jamais masqué : le registre est
# une checklist qui rétrécit, et un contrôle ajouté sans ses scénarios y apparaît
# sans y être écrit — donc casse la CI. La régénération est explicite à dessein.
[tasks.veracity-update]
description = "Régénère le registre de dette du contrat de véracité (internal/veracity/testdata/debt.txt) après avoir ajouté un contrôle ou un scénario"
run = "PEPIN_UPDATE_VERACITY=1 go test ./internal/veracity/ -run 'DebtLedgerIsExact' -count=1"

# Tracer les appels RÉELS d'un collecteur (issue #84). Le contrat de véracité
# prouve la chaîne à partir d'une réponse canned ; celle-ci ne prouve rien du
# CÂBLAGE de la spec `collecte`, c'est-à-dire quels endpoints partent vraiment
# sur le réseau.
# L'enregistrement le mesure, la porte `TestTheRecordedCollectionStillHappens` le
# rejoue en CI sans émulateur ni compte. Contre un ÉMULATEUR LOCAL uniquement :
# ce qu'un fournisseur RÉPOND reste dû à un scan réel.
[tasks.trace]
description = "Enregistre les appels HTTP réels d'un collecteur contre l'émulateur local feint (aucun identifiant cloud)"
depends = ["build"]
run = "scripts/trace-collector.sh ${PROVIDER:-scaleway} ${OUT:-.trace}"

# Les TENANTS DE RÉFÉRENCE (issue #58) : des configurations tierces, publiées et
# licenciées, rejouées à chaque build. Une fixture est écrite par l'auteur de la
# règle, donc elle est AUTO-CONFIRMANTE : elle prouve que la règle se déclenche,
# jamais qu'elle a raison sur une configuration que personne n'a conçue pour elle.
# Un faux positif ne se voit que là.
# La régénération est explicite : un verdict qui bascule sur un amont ÉPINGLÉ est
# un faux positif ou un faux négatif, et il se dit avant de se réécrire.
[tasks.tenants-update]
description = "Régénère les verdicts attendus des tenants de référence (references/tenants/*/*/expected.txt)"
run = "PEPIN_UPDATE_TENANTS=1 go test ./internal/tenants/ -run 'ExpectedVerdicts' -count=1"

[tasks.tenants-refresh]
description = "Régénère les PLANS des tenants de référence depuis leur amont épinglé (requiert terraform et le registre)"
run = "scripts/reference-tenant.sh --all"

[tasks.frozen-update]
description = "Régénère les fixtures de surface gelée (cmd/testdata/frozen/) après un changement délibéré ; incrémenter ensuite la constante de version de la surface"
run = "PEPIN_UPDATE_FROZEN=1 go test ./cmd/ -run 'Frozen|Fixture|VersionBump' -count=1"

[tasks.tag-ruleset]
description = "Pose le ruleset GitHub qui restreint la création des tags v* aux admins"
run = "tools/release/apply-tag-ruleset.sh"

[tasks.branch-ruleset]
description = "Pose la protection de la branche par défaut (PR + revue CODEOWNER + status checks)"
run = "tools/release/apply-branch-ruleset.sh"

[tasks.demo]
description = "Ré-enregistre le GIF de démonstration du README (vhs) à la version publiée"
# Le tape est versionné, le GIF en est un PRODUIT. Cet ordre est le sujet même du
# projet : un enregistrement que personne ne peut rejouer est une affirmation, pas
# une preuve. Chaque commande du tape s'exécute réellement, donc une démo qui casse
# est une démo qui dit la vérité sur une régression.
#
# La version affichée n'est jamais écrite à la main : elle est INJECTÉE au build,
# et consignée dans docs/assets/quickstart.version. Le preflight refuse de taguer
# si ce fichier ne nomme pas la version demandée — sans quoi le README montrerait
# durablement la démo d'une version antérieure.
#
#   mise run demo                              # version dérivée de git describe
#   PEPIN_DEMO_VERSION=v0.1.1 mise run demo    # version imposée, celle qu'on va taguer
#
# La version passe par l'ENVIRONNEMENT et non par un argument : mise appende les
# arguments à la dernière commande du script au lieu de les exposer en $1, ce qui
# faisait enregistrer la version dérivée de git tout en croyant l'avoir imposée.
#
# DEUX enregistrements, un par langue : Pépin est bilingue, et un lecteur du
# README anglais ne doit pas ouvrir la page sur une démo qu'il ne lit pas.
# quickstart.gif accompagne README.md, quickstart.fr.gif accompagne README.fr.md.
# Chaque tape impose sa langue par PEPIN_LANG ; les commandes exécutées sont les
# mêmes des deux côtés.
#
# Requiert vhs (et le ttyd + ffmpeg qu'il pilote) :
#   go install github.com/charmbracelet/vhs@latest
run = """
set -eu
command -v vhs >/dev/null 2>&1 || { echo "vhs absent : go install github.com/charmbracelet/vhs@latest" >&2; exit 1; }
version="${PEPIN_DEMO_VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
go build -trimpath -ldflags "-s -w -X github.com/stephrobert/pepin/cmd.version=${version}" -o pepin .
PATH="$PWD:$PATH" vhs tools/demo/quickstart.en.tape
PATH="$PWD:$PATH" vhs tools/demo/quickstart.fr.tape
printf '%s\n' "${version}" > docs/assets/quickstart.version
echo "Démos enregistrées pour ${version} (GIF + MP4, même exécution) :"
ls -lh docs/assets/quickstart.gif docs/assets/quickstart.fr.gif docs/assets/quickstart.mp4 docs/assets/quickstart.fr.mp4
"""

[tasks.release-check]
description = "Tout ce qui doit être vrai avant qu'un tag existe : mise run release-check -- vX.Y.Z"
run = "tools/release/preflight.sh"

# Le CANARI (issue #59) : la seule mesure du dépôt qui interroge le VRAI plan de
# contrôle d'un fournisseur souverain. Il ne détient AUCUN identifiant — il envoie
# des valeurs synthétiques et mesure le REFUS —, donc il ne peut pas en écrire un.
# Un geste de MAINTENEUR, jamais de CI : le relevé est consigné, daté, committé, et
# le preflight n'exige que sa fraîcheur (canary.MaxAge). La complétude, elle, est
# une porte de test ordinaire (internal/canary), parce qu'elle ne dépend pas du jour.
[tasks.canary]
description = "Interroge les vrais plans de contrôle sans identifiant et consigne le relevé daté (references/canary/)"
run = "tools/release/canary.sh"

[tasks.secrets]
description = "Scan de secrets par motif (gitleaks), historique git compris"
run = "gitleaks detect --source . --no-banner --redact --config .gitleaks.toml"

[tasks.vet]
description = "Analyse statique du compilateur"
run = "go vet ./..."

[tasks.lint]
description = "Méta-linter (golangci-lint)"
run = "golangci-lint run"

[tasks.sec]
description = "Analyse de sécurité du code (gosec)"
run = "gosec -quiet ./..."

[tasks.vuln]
description = "Vulnérabilités des dépendances Go appelées (govulncheck)"
run = "govulncheck ./..."

[tasks.osv]
description = "Dépendances vulnérables ET paquets malveillants (OSV-Scanner)"
run = "osv-scanner scan -L go.mod"

[tasks.audit]
description = "Qualité complète (vet + lint + sécurité + vulnérabilités + OSV)"
depends = ["vet", "lint", "sec", "vuln", "osv"]

[tasks.fmt]
description = "Formatage Go et Rego"
run = [
  "gofmt -w .",
  "opa fmt -w internal/commonrules/rules",
]

[tasks.run]
description = "Scan de démonstration (hors-ligne, aucun compte requis)"
depends = ["build"]
run = "./pepin scan scaleway examples/scaleway/inventory.json"

[tasks.providers]
description = "Liste les providers déclaratifs enregistrés"
depends = ["build"]
run = "./pepin provider list"

[tasks.clean]
description = "Retire le binaire"
run = "rm -f pepin"

[tasks.tools]
description = "Installe les outils Go de dev (lint + sécurité + vulnérabilités)"
# Versions ÉPINGLÉES : `@latest` fait tirer du code non choisi sur la machine du
# mainteneur — celle qui détient les clés de release — et rend le job d'audit de
# CI non reproductible. La version de golangci-lint suit celle de ci.yml.
run = [
  "go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2",
  "go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0",
  "go install golang.org/x/vuln/cmd/govulncheck@v1.7.0",
  "go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1",
]

[tasks.adr-drift]
description = "Détecte la dérive de forme entre les ADR et le dépôt"
# Partiel par construction : ce contrôle voit un chemin disparu, une garde
# introuvable, un statut incohérent. Il ne voit pas qu'un ADR est devenu faux.
# Un rapport vide ne dispense pas de relire.
run = "python3 tools/adr/drift.py"

[tasks.falsify]
description = "Rejoue une falsification, ou prouve le harnais sur son propre historique : mise run falsify -- --selftest"
# Porté de feint (Apache-2.0, même auteur). La procédure était une COUTUME : chaque
# lot rapportait ses mutations dans un tableau de PR, et rien ne rattrapait celui
# qui n'y pensait pas. Pire, une mutation qui ne compile pas fait échouer TOUS les
# tests, ce qui ressemble exactement à la garde qui se prouve — erreur commise deux
# fois dans la même session avant que ce harnais n'arrive. Il la refuse.
run = "python3 tools/falsify/falsify.py"

[tasks."falsify:selftest"]
description = "Le harnais de falsification se prouve sur ses propres erreurs historiques"
run = "python3 tools/falsify/falsify.py --selftest"

[tasks."falsify:all"]
description = "Rejoue toutes les specs de falsification versionnées"
run = "python3 tools/falsify/falsify.py --all tools/falsify/specs"

[tasks.fuzz]
description = "Cherche des entrées qui font paniquer les parseurs. Campagne longue : FUZZTIME=5m mise run fuzz"
# Les deux cibles existaient depuis longtemps SANS jamais chercher : `go test`
# n'exécute que le corpus de graines, donc le fuzzing était une non-régression, pas
# une recherche. Les cibles visent le bon endroit — les parseurs d'entrée non
# fiable, ce que la §5 du CLAUDE.md exige : « parser défensivement, jamais de
# panique ». Une trouvaille rejoint testdata/fuzz/, donc elle est gardée pour
# toujours.
run = """
set -eu
t="${FUZZTIME:-30s}"
echo "campagne de ${t} par cible"
go test ./internal/tfparse/ -run '^$' -fuzz 'FuzzParsePlan' -fuzztime="$t"
go test ./cmd/ -run '^$' -fuzz 'FuzzInventoryWalk' -fuzztime="$t"
"""

[tasks.prepush]
description = "Tout ce sur quoi une PR échouera, qui coûte des secondes et n'exige aucun compte"
depends = ["validate", "test", "audit", "adr-drift", "secrets", "falsify:selftest"]
# Ce que c'est, et ce que ce n'est délibérément PAS.
#
# Chacune de ces portes est déterministe, hors ligne, et tient en quelques
# secondes : elles peuvent être un hook sans jamais apprendre `--no-verify` à
# personne. C'est la seule façon qu'une porte serve — une porte qu'on ne lance
# qu'en CI est une porte qu'on découvre après avoir poussé.
#
# Ce qu'elle n'attrape PAS, et il faut le savoir : tout ce qui exige un compte
# cloud, une campagne longue (fuzz, falsify:all) ou l'observation d'un vrai
# fournisseur. Ces choses vivent en nocturne ou à la qualification de release,
# précisément pour ne pas rendre ce chemin-ci trop lent pour être suivi.
run = "echo 'prepush : toutes les portes locales sont vertes'"
